<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Button lab: slam + zap test</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="shake">
      <div class="paper"></div>
      <header class="tabhead">
        <div class="tab">THE GAME PASS BUTTON</div>
        <div class="strip"><span>ANIMATION TEST · SLAM + ZAP</span></div>
      </header>
      <div id="labreel"><div class="q">?</div></div>
      <div id="impactbg"></div>
      <svg id="bolts" viewBox="0 0 1080 1920"></svg>
      <div id="pedestal"><div class="col"></div></div>
      <div id="bigbutton"><div class="base"></div><div class="dome"><span>PRESS</span></div></div>
      <svg id="fxback" viewBox="0 0 1080 1920"></svg>
      <div id="avatar"></div>
      <svg id="fxsvg" viewBox="0 0 1080 1920"></svg>
      <div id="boom">KA-CHUNK!</div>
      <div id="bubble"><div class="txt"></div></div>

      <div id="flash"></div>
      <div id="safe"></div>
    </div>
  </div>
</div>
<div id="ui">
  <button id="play" disabled>LOADING POSES…</button>
  <footer>Test build: one slam, one electrocution. Sound on.</footer>
</div>
<script type="module" src="lab.js"></script>
</body>
</html>
